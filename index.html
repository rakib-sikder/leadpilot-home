<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadAutoPilot</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #131a23;
    --border: #232c38;
    --text: #e7edf5;
    --muted: #8a96a6;
    --accent: #4f8cff;
    --accent2: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #10151d 0%, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .brand .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .brand h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
  }
  a.item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s ease;
  }
  a.item:hover { background: #1a2330; }
  a.item + a.item { border-top: 1px solid var(--border); }
  .icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
  }
  .icon.dash { background: rgba(79,140,255,0.15); }
  .icon.ext  { background: rgba(34,197,94,0.15); }
  .icon.remote { background: rgba(168,85,247,0.16); }
  .item .label { font-size: 15px; font-weight: 600; }
  .item .desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .item .go { margin-left: auto; color: var(--muted); font-size: 18px; }
  a.item[aria-disabled="true"] { opacity: .58; cursor: wait; }
  footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">📡</div>
      <div>
        <h1>LeadAutoPilot</h1>
        <p>Choose where you want to go</p>
      </div>
    </div>
    <div class="card">
      <a class="item" href="http://168.107.75.218:8080/" target="_blank" rel="noopener">
        <div class="icon dash">📊</div>
        <div>
          <div class="label">CL Lead Dashboard</div>
          <div class="desc">Leads, stats, screenshots (x86-1)</div>
        </div>
        <div class="go">›</div>
      </a>
      <a class="item" href="http://168.107.80.211:6080/vnc.html" target="_blank" rel="noopener">
        <div class="icon ext">🖥️</div>
        <div>
          <div class="label">Extension / Remote Desktop</div>
          <div class="desc">Chromium + Google Messages (x86-2)</div>
        </div>
        <div class="go">›</div>
      </a>
      <a class="item" id="leadpilotRemote" href="https://rakib-sikder.github.io/leadpilot-remote/"
         target="_blank" rel="noopener">
        <div class="icon remote">💬</div>
        <div>
          <div class="label">LeadPilot Remote</div>
          <div class="desc" id="leadpilotStatus">Secure remote gateway — password required</div>
        </div>
        <div class="go">›</div>
      </a>
    </div>
    <footer>leadautopilot.mooo.com</footer>
  </div>
</body>
</html>
